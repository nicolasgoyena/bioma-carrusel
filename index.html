<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Últimas Publicaciones Científicas - BIOMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --verde:      #3ab549;
      --verde-dark: #2a8a36;
      --verde-pale: #edf7ee;
      --gris-text:  #2c2c2c;
      --gris-mid:   #666;
      --gris-light: #f4f4f4;
      --blanco:     #ffffff;
      --borde:      #e0e0e0;
      --font-title: 'Playfair Display', serif;
      --font-body: 'Roboto', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      overflow-x: hidden;
      background: transparent;
    }

    body {
      font-family: var(--font-body);
      background: transparent;
      padding: 60px 0;
      color: var(--gris-text);
      /* Rompe el max-container del padre Liferay */
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
    }

    .bioma-publicaciones { width: 100vw; }

    .bioma-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 36px; gap: 16px; flex-wrap: wrap;
      padding: 0 48px;
    }
    .bioma-eyebrow {
      font-family: var(--font-body); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase; color: var(--verde); margin-bottom: 8px;
    }
    .bioma-titulo {
      font-family: var(--font-title); font-size: 2.4rem; font-weight: 700;
      color: var(--gris-text); line-height: 1.2;
    }
    .bioma-ver-todas {
      font-family: var(--font-body); font-size: 0.9rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--verde-dark);
      text-decoration: none; border-bottom: 2px solid var(--verde);
      padding-bottom: 2px; transition: color 0.2s; white-space: nowrap;
    }
    .bioma-ver-todas:hover { color: var(--verde); }

    .carrusel-outer {
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .carrusel-track {
      display: flex;
      gap: 28px;
      padding: 12px 48px 20px;
      will-change: transform;
    }

    .card {
      min-width: 360px;
      max-width: 360px;
      background: var(--blanco);
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      flex-shrink: 0;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.13);
    }
    .card-top-bar { height: 5px; background: var(--verde); flex-shrink: 0; }
    .card-body {
      padding: 22px 22px 14px; flex: 1;
      display: flex; flex-direction: column; gap: 12px;
    }
    .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-anio {
      font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px;
      color: var(--verde-dark); text-transform: uppercase;
    }
    .card-tipo {
      font-size: 0.74rem; font-weight: 600; color: var(--verde-dark);
      background: var(--verde-pale); border-radius: 30px;
      padding: 3px 12px; text-transform: uppercase; letter-spacing: 0.8px;
    }
    .card-titulo {
      font-family: var(--font-title); font-size: 1.05rem; font-weight: 700;
      color: var(--gris-text); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-autores-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--verde); margin-bottom: -6px;
    }
    .card-autores {
      font-size: 0.85rem; color: var(--gris-mid); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer {
      padding: 14px 22px 20px; border-top: 1px solid var(--borde); margin-top: auto;
    }
    .card-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--verde-dark);
      text-decoration: none; transition: color 0.2s, gap 0.2s;
    }
    .card-link:hover { color: var(--verde); gap: 10px; }
    .card-link-arrow { font-size: 1rem; line-height: 1; }
    .card-sin-enlace { font-size: 0.78rem; color: #bbb; font-style: italic; }

    .indicadores { display: flex; justify-content: center; gap: 7px; margin-top: 28px; }
    .indicador {
      width: 7px; height: 7px; border-radius: 50%; background: #ccc;
      cursor: pointer; transition: background 0.25s, transform 0.25s;
    }
    .indicador.activo { background: var(--verde); transform: scale(1.3); }

    @media (max-width: 1200px) {
      .card { min-width: 320px; max-width: 320px; }
    }
    @media (max-width: 900px) {
      .card { min-width: 290px; max-width: 290px; }
      .bioma-titulo { font-size: 1.8rem; }
      .bioma-header { padding: 0 24px; }
      .carrusel-track { padding: 12px 24px 20px; }
    }
    @media (max-width: 600px) {
      .card { min-width: calc(100vw - 60px); max-width: calc(100vw - 60px); }
      .bioma-ver-todas { display: none; }
      .bioma-header { padding: 0 16px; }
      .carrusel-track { padding: 12px 16px 20px; }
    }
  </style>
</head>
<body>

<section class="bioma-publicaciones">
  <div class="bioma-header">
    <div class="bioma-header-left">
      <p class="bioma-eyebrow">Instituto BIOMA · UNAV</p>
      <h2 class="bioma-titulo">Últimas publicaciones</h2>
    </div>
    <a class="bioma-ver-todas"
       href="https://portalcientifico.unav.edu/unidades/22157/publicaciones"
       target="_blank" rel="noopener">
      Ver todas las publicaciones →
    </a>
  </div>

  <div class="carrusel-outer" id="carrusel-outer">
    <div class="carrusel-track" id="carrusel"></div>
  </div>

  <div class="indicadores" id="indicadores"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1tMv-ttzHwAf3ig7FYrpT2cBZxDDrz4gVSJ4EChf6nz0/export?format=csv&gid=1652416312";

  const GAP = 28;
  const CARD_W = 360;
  const STEP = CARD_W + GAP;
  const SPEED_PX_PER_S = 60;

  let PUBLICACIONES = [];
  let offset = 0;
  let paused = false;
  let lastTs = null;
  let rafId = null;
  let totalWidth = 0;

  function crearCard(p) {
    const miembros = Array.isArray(p.miembros) ? p.miembros.join(", ") : (p.miembros || "");
    const enlace = p.url || null;

    const article = document.createElement("article");
    article.className = "card";
    article.innerHTML = `
      <div class="card-top-bar"></div>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-anio">${p.anio ? parseInt(p.anio) || p.anio : "—"}</span>
          ${p.tipo ? `<span class="card-tipo">${p.tipo}</span>` : ""}
        </div>
        <h3 class="card-titulo">${p.titulo || "Sin título"}</h3>
        ${miembros ? `
          <p class="card-autores-label">Autores BIOMA</p>
          <p class="card-autores">${miembros}</p>
        ` : ""}
      </div>
      <div class="card-footer">
        ${enlace
          ? `<a class="card-link" href="${enlace}" target="_blank" rel="noopener">
               Ver en portal científico <span class="card-link-arrow">→</span>
             </a>`
          : `<span class="card-sin-enlace">Enlace no disponible</span>`
        }
      </div>
    `;
    return article;
  }

  function mostrarMensaje(msg) {
    document.getElementById("carrusel").innerHTML =
      `<p style="padding:20px 48px;">${msg}</p>`;
  }

  function agruparPublicaciones(rows) {
    const mapa = new Map();

    rows.forEach(row => {
      const titulo = (row["Título"] || "").trim();
      const id = (row["ID"] || "").trim();
      const url = (row["URL"] || "").trim();
      const anio = (row["Año de publicación"] || "").trim();
      const tipo = (row["Tipo de publicación"] || "").trim();
      const doi = (row["DOI"] || "").trim();
      const miembro = (row["Miembro"] || "").trim();

      if (!titulo) return;

      const clave = id || url || titulo;

      if (!mapa.has(clave)) {
        mapa.set(clave, {
          titulo: titulo,
          anio: anio,
          tipo: tipo,
          doi: doi,
          url: url,
          miembros: []
        });
      }

      const pub = mapa.get(clave);

      if (miembro && !pub.miembros.includes(miembro)) {
        pub.miembros.push(miembro);
      }
    });

    return Array.from(mapa.values())
      .sort((a, b) => {
        const ay = parseInt(a.anio) || 0;
        const by = parseInt(b.anio) || 0;
        return by - ay;
      });
  }

  function renderCarrusel() {
    const track = document.getElementById("carrusel");
    track.innerHTML = "";

    if (!PUBLICACIONES.length) {
      mostrarMensaje("No hay publicaciones disponibles.");
      return;
    }

    const all = [...PUBLICACIONES, ...PUBLICACIONES, ...PUBLICACIONES];
    all.forEach(p => track.appendChild(crearCard(p)));

    totalWidth = PUBLICACIONES.length * STEP;
    offset = totalWidth;
    track.style.transform = `translateX(${-offset}px)`;
  }

  function tick(ts) {
    if (PUBLICACIONES.length && !paused) {
      if (lastTs !== null) {
        const delta = ts - lastTs;
        offset += (SPEED_PX_PER_S * delta) / 1000;

        if (offset >= totalWidth * 2) offset -= totalWidth;
        if (offset < totalWidth) offset += totalWidth;

        document.getElementById("carrusel").style.transform = `translateX(${-offset}px)`;
      }
      lastTs = ts;
    } else {
      lastTs = null;
    }

    rafId = requestAnimationFrame(tick);
  }

  async function cargarPublicaciones() {
    const url = SHEET_CSV_URL + "&t=" + Date.now();
    const response = await fetch(url, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const text = await response.text();

    const parsed = Papa.parse(text, {
      header: true,
      skipEmptyLines: true
    });

    console.log("Columnas detectadas:", parsed.meta.fields);
    console.log("Primeras filas:", parsed.data.slice(0, 3));

    const filtradas = parsed.data.filter(row => {
      const tipo = (row["Tipo de publicación"] || "").toLowerCase();
    
      // excluir basura
      if (tipo.includes("erratum")) return false;
      if (tipo.includes("corrigendum")) return false;
      if (tipo.includes("editorial")) return false;
    
      return true;
    });


    const todasAgrupadas = agruparPublicaciones(filtradas);
    const anioActual = new Date().getFullYear().toString();
    const delAnioActual = todasAgrupadas.filter(p => p.anio === anioActual);
    
    // Mezclar aleatoriamente y coger 15
    const mezcladas = delAnioActual.sort(() => Math.random() - 0.5);
    PUBLICACIONES = mezcladas.slice(0, 15);

    console.log("Publicaciones agrupadas:", PUBLICACIONES.length);
    console.log("Primeras publicaciones agrupadas:", PUBLICACIONES.slice(0, 3));
  }

  async function iniciar() {
    const outer = document.getElementById("carrusel-outer");

    outer.addEventListener("mouseenter", () => { paused = true; });
    outer.addEventListener("mouseleave", () => { paused = false; });
    outer.addEventListener("touchstart", () => { paused = true; }, { passive: true });
    outer.addEventListener("touchend", () => {
      setTimeout(() => { paused = false; }, 2000);
    });

    try {
      await cargarPublicaciones();
      renderCarrusel();
    } catch (err) {
      console.error(err);
      mostrarMensaje("Error al cargar publicaciones: " + err.message);
    }

    rafId = requestAnimationFrame(tick);
  }

  iniciar();
</script>

</body>
</html>
