      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;

    .card-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--verde-dark);

    .nav-btn.next { right: -22px; }

      .card { min-width: calc(100vw - 80px); max-width: calc(100vw - 80px); }

": "Weaponizing nutrition: plants use a double strategy to fight herbivory, converting nutritionally essential fatty acids into defensive oxylipin signals", "anio": "2026.0", "miembros": ["Zamarreño Arregui, Ángel", "García-Mina Freire, José María"], "doi": "10.1111/NPH.71155", "tipo": "Artículo", "url": "https://portalcientifico.unav.edu/documentos/69e3b5ec25ad817cf843c373", "areas_jci": "Área: PLANT SCIENCES Cuartil: Q1 Posición en el área: 9/275 |"}];
  const CARDS_VISIBLES = 3;
  const CARD_WIDTH     = 320 + 24;
  const AUTOPLAY_MS    = 6000;

  let posicion      = 0;
  let autoplayTimer = null;

  function renderCarrusel() {
    document.getElementById("carrusel").innerHTML = PUBLICACIONES.map(p => {
      const miembros = Array.isArray(p.miembros) ? p.miembros.join(", ") : (p.miembros || "");
      const enlace   = p.url || null;
      return `
        <article class="card">
          <div class="card-top-bar"></div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-anio">${p.anio || "—"}</span>
              ${p.tipo ? `<span class="card-tipo">${p.tipo}</span>` : ""}
            </div>
            <h3 class="card-titulo">${p.titulo || "Sin título"}</h3>
            ${miembros ? `
              <p class="card-autores-label">Autores BIOMA</p>
              <p class="card-autores">${miembros}</p>
            ` : ""}
          </div>
          <div class="card-footer">
            ${enlace
              ? `<a class="card-link" href="${enlace}" target="_blank" rel="noopener">
                   Ver en portal científico <span class="card-link-arrow">→</span>
                 </a>`
              : `<span class="card-sin-enlace">Enlace no disponible</span>`
            }
          </div>
        </article>
      `;
    }).join("");
  }

  function renderIndicadores() {
    const maxPos = Math.max(0, PUBLICACIONES.length - CARDS_VISIBLES);
    document.getElementById("indicadores").innerHTML =
      Array.from({ length: maxPos + 1 }, (_, i) =>
        `<div class="indicador ${i === 0 ? "activo" : ""}" onclick="irA(${i})"></div>`
      ).join("");
  }

  function mover(dir) {
    const maxPos = Math.max(0, PUBLICACIONES.length - CARDS_VISIBLES);
    posicion     = Math.min(Math.max(posicion + dir, 0), maxPos);
    aplicar(); reiniciarAutoplay();
  }

  function irA(idx) { posicion = idx; aplicar(); reiniciarAutoplay(); }

  function aplicar() {
    document.getElementById("carrusel").scrollLeft = posicion * CARD_WIDTH;
    document.querySelectorAll(".indicador").forEach((el, i) =>
      el.classList.toggle("activo", i === posicion)
    );
  }

  function iniciarAutoplay() {
    autoplayTimer = setInterval(() => {
      const maxPos = Math.max(0, PUBLICACIONES.length - CARDS_VISIBLES);
      posicion     = posicion >= maxPos ? 0 : posicion + 1;
      aplicar();
    }, AUTOPLAY_MS);
  }

  function reiniciarAutoplay() { clearInterval(autoplayTimer); iniciarAutoplay(); }

  renderCarrusel();
  renderIndicadores();
  iniciarAutoplay();
</script>
