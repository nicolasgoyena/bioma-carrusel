<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lo último de BIOMA - Publicaciones científicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    /* Paleta y tipografías del manual de marca BIOMA */
    :root {
      --bioma-blue:       #5297d2;
      --bioma-blue-light: #92c3ea;
      --bioma-green-dark: #475a23;
      --bioma-lime:       #babf0a;
      --bioma-sand:       #e8e3d9;
      --font-title: 'Playfair Display', serif;
      --font-body:  'Roboto', sans-serif;

      --card-w: 440px;
      --card-h: 252px;
      --gap: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bioma-green-dark);
      color: #fff;
      overflow: hidden;
    }

    .bioma {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 560px;
      overflow: hidden;
      background: var(--bioma-green-dark);
    }

    /* Tubos de la marca (decoración) */
    .tubos { position: absolute; left: 0; top: 0; width: 420px; height: 100%; pointer-events: none; }
    .tubos path { fill: none; stroke-linecap: round; }

    /* Bloque de texto de la izquierda */
    .intro {
      position: absolute; left: 64px; top: 0; bottom: 0; width: 300px; z-index: 2;
      display: flex; flex-direction: column; justify-content: center; gap: 22px;
    }
    .intro h2 {
      font-family: var(--font-title); font-weight: 700;
      font-size: 54px; line-height: 1.05; letter-spacing: -0.5px;
    }
    .intro p { font-size: 18px; font-weight: 300; line-height: 1.5; }
    .ver-todas {
      align-self: flex-start; color: #fff; text-decoration: none;
      font-size: 16px; font-weight: 500;
      padding-bottom: 4px; border-bottom: 3px solid var(--bioma-lime);
    }

    /* Doble cinta */
    .muro {
      position: absolute; left: 400px; right: 0; top: 0; bottom: 0;
      overflow: hidden;
      display: flex; flex-direction: column; justify-content: center; gap: var(--gap);
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 80px, #000 calc(100% - 40px), transparent 100%);
              mask-image: linear-gradient(to right, transparent 0, #000 80px, #000 calc(100% - 40px), transparent 100%);
    }
    .fila {
      display: flex; gap: var(--gap); padding-right: var(--gap);
      width: max-content; padding-block: 8px;
      animation-timing-function: linear; animation-iteration-count: infinite;
    }
    .fila.izq { animation-name: hacia-izq; }
    .fila.der { animation-name: hacia-der; }
    .muro:hover .fila, .muro:focus-within .fila { animation-play-state: paused; }
    @keyframes hacia-izq { from { transform: translateX(0); }    to { transform: translateX(-50%); } }
    @keyframes hacia-der { from { transform: translateX(-50%); } to { transform: translateX(0); } }

    /* Tarjeta */
    .card {
      flex: 0 0 auto; width: var(--card-w); height: var(--card-h);
      display: flex; flex-direction: column;
      border-radius: 26px; overflow: hidden;
      background: #fff; color: #000; text-decoration: none;
      box-shadow: 0 14px 32px rgba(20, 30, 5, 0.32);
      transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
    }
    .card:hover { transform: translateY(-6px) rotate(-0.8deg); box-shadow: 0 22px 44px rgba(20, 30, 5, 0.45); }
    .card:hover .card-mas { text-decoration-thickness: 3px; }
    .card-cab {
      height: 60px; flex: 0 0 auto; padding: 0 22px;
      display: flex; align-items: center; gap: 12px;
    }
    .card-revista { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
    .card-q { background: #fff; border-radius: 99px; padding: 3px 10px; font-weight: 700; font-size: 13px; }
    .card-cuerpo {
      flex: 1; min-height: 0; padding: 16px 22px 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card-titulo { font-family: var(--font-title); font-weight: 700; font-size: 19px; line-height: 1.3; }
    .card-autores { font-size: 14px; line-height: 1.4; color: #3d3d3d; }
    .card-mas {
      margin-top: auto; font-size: 14px; font-weight: 500; color: var(--bioma-green-dark);
      text-decoration: underline; text-decoration-color: var(--bioma-lime);
      text-underline-offset: 5px; text-decoration-thickness: 2px;
    }
    .clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    .card:focus-visible, .ver-todas:focus-visible { outline: 3px solid var(--bioma-lime); outline-offset: 4px; }

    .mensaje { padding: 0 24px; font-size: 16px; font-weight: 300; }

    /* Pantallas medianas */
    @media (max-width: 1100px) {
      :root { --card-w: 380px; }
      .intro { left: 40px; width: 250px; }
      .intro h2 { font-size: 44px; }
      .muro { left: 320px; }
    }

    /* Móvil: el texto pasa arriba y las tarjetas debajo */
    @media (max-width: 760px) {
      :root { --card-w: 290px; --card-h: 206px; --gap: 12px; }
      .tubos { display: none; }
      .intro {
        position: static; width: auto; padding: 24px 20px 12px; gap: 10px;
      }
      .intro h2 { font-size: 32px; }
      .intro p { font-size: 15px; }
      .ver-todas { font-size: 14px; }
      .muro {
        position: static; justify-content: flex-start;
        -webkit-mask-image: none; mask-image: none;
      }
      .card-cab { height: 48px; padding: 0 16px; }
      .card-cuerpo { padding: 12px 16px 14px; gap: 6px; }
      .card-titulo { font-size: 16px; }
      .card-autores, .card-mas { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fila { animation: none !important; }
      .muro { overflow-x: auto; }
      .card { transition: none; }
    }
  </style>
</head>
<body>

<section class="bioma" aria-labelledby="bioma-titulo">
  <svg class="tubos" aria-hidden="true" viewBox="0 0 420 600" preserveAspectRatio="xMinYMax slice">
    <path d="M -80 480 C 110 480 230 430 300 350" stroke="#babf0a" stroke-width="70"></path>
    <path d="M 190 690 C 190 615 240 568 320 568" stroke="#92c3ea" stroke-width="70"></path>
    <path d="M -60 40 C 40 40 90 10 110 -60" stroke="#5297d2" stroke-width="56"></path>
  </svg>

  <div class="intro">
    <h2 id="bioma-titulo">Lo último de BIOMA</h2>
    <p id="bioma-resumen">Cargando publicaciones…</p>
    <a class="ver-todas"
       href="https://portalcientifico.unav.edu/unidades/22157/publicaciones"
       target="_blank" rel="noopener">Ver todas en el Portal Científico</a>
  </div>

  <div class="muro" id="muro">
    <div class="fila izq" id="fila1"></div>
    <div class="fila der" id="fila2"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1tMv-ttzHwAf3ig7FYrpT2cBZxDDrz4gVSJ4EChf6nz0/export?format=csv&gid=1652416312";

  // Solo se muestran estos valores de "Tipo de publicación".
  // Fuera: Errata, Editorial, Reseña, Nota, Carta (y cualquier tipo nuevo no listado).
  const TIPOS_PERMITIDOS = new Set([
    "artículo", "revisión", "artículo de datos",
    "libro", "capítulo de libro", "aportación congreso", "aportación a congreso"
  ]);

  const MAX_PUBLICACIONES = 30;        // máximo de tarjetas entre las dos filas
  const VELOCIDAD_PX_S = 28;           // velocidad de las cintas
  const COLORES = ["#92c3ea", "#babf0a", "#e8e3d9", "#5297d2"];
  // ---- Idioma -------------------------------------------------------------
  // 1) ?lang=en en la URL del iframe (lo más fiable: se pone en la versión
  //    inglesa del contenido en Liferay)
  // 2) si no, la URL de la página que lo incrusta contiene /en/ (solo funciona
  //    si el navegador manda la ruta completa como referrer)
  // 3) por defecto, castellano
  function detectarIdioma() {
    const param = new URLSearchParams(location.search).get("lang");
    if (param) return param.toLowerCase().startsWith("en") ? "en" : "es";
    try {
      const ref = new URL(document.referrer);
      if (/^\/en(\/|$)/.test(ref.pathname)) return "en";
    } catch (e) { /* sin referrer */ }
    return "es";
  }
  const LANG = detectarIdioma();

  const TEXTOS = {
    es: {
      titulo: "Lo último de BIOMA",
      cargando: "Cargando publicaciones…",
      verTodas: "Ver todas en el Portal Científico",
      leer: "Leer la publicación",
      resumen: (anio) => `Trabajos publicados en ${anio} por investigadoras e investigadores del instituto.`,
      sinDatos: "Todavía no hay publicaciones de este año.",
      error: "No se han podido cargar las publicaciones.",
      y: " y ",
      mas: n => ` y ${n} más`,
      meses: ["", "enero", "febrero", "marzo", "abril", "mayo", "junio",
              "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"],
      tipos: {}
    },
    en: {
      titulo: "Latest from BIOMA",
      cargando: "Loading publications…",
      verTodas: "See all on the Research Portal",
      leer: "Read the publication",
      resumen: (anio) => `Publications from ${anio} by researchers at the institute.`,
      sinDatos: "No publications yet this year.",
      error: "Publications could not be loaded.",
      y: " and ",
      mas: n => ` and ${n} more`,
      meses: ["", "January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"],
      tipos: {
        "artículo": "Article", "revisión": "Review", "artículo de datos": "Data paper",
        "libro": "Book", "capítulo de libro": "Book chapter", "aportación congreso": "Conference paper"
      }
    }
  };
  const T = TEXTOS[LANG];
  const MESES = T.meses;

  // Escapa texto de la hoja antes de meterlo en innerHTML
  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // "Apellidos, Nombre" → "Nombre Apellidos"
  function normalizarNombre(raw) {
    const partes = raw.split(",");
    if (partes.length >= 2) {
      const apellidos = partes[0].trim();
      const nombre = partes.slice(1).join(",").trim();
      if (nombre) return nombre + " " + apellidos;
    }
    return raw.trim();
  }

  // Títulos que llegan TODO EN MAYÚSCULAS → solo la primera letra en mayúscula
  function normalizarTitulo(t) {
    const letras = t.replace(/[^A-Za-zÀ-ÿ]/g, "");
    if (letras.length > 10 && letras === letras.toUpperCase()) {
      const s = t.toLowerCase();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    return t;
  }

  function autoresTxt(a) {
    if (a.length <= 2) return a.join(T.y);
    return a[0] + ", " + a[1] + T.mas(a.length - 2);
  }

  function mezclar(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function agruparPublicaciones(rows) {
    const mapa = new Map();
    rows.forEach(row => {
      const titulo = (row["Título"] || "").trim();
      if (!titulo) return;
      const id = (row["ID"] || "").trim();
      const url = (row["URL"] || "").trim();
      const clave = id || url || titulo;

      if (!mapa.has(clave)) {
        mapa.set(clave, {
          titulo: normalizarTitulo(titulo),
          anio: (row["Año de publicación"] || "").trim(),
          mes: parseInt(row["Mes"], 10) || 0,
          tipo: (row["Tipo de publicación"] || "").trim(),
          revista: (row["sourceTitle"] || "").trim(),
          cuartil: (row["Cuartil JIF"] || "").trim(),
          url: url,
          miembros: []
        });
      }
      const miembro = normalizarNombre((row["Miembro"] || "").trim());
      const pub = mapa.get(clave);
      if (miembro && !pub.miembros.includes(miembro)) pub.miembros.push(miembro);
    });
    return Array.from(mapa.values());
  }

  function crearCard(p, i) {
    const enlace = /^https?:\/\//i.test(p.url) ? p.url : "https://portalcientifico.unav.edu/unidades/22157/publicaciones";
    const q = /^Q[1-4]$/.test(p.cuartil) ? p.cuartil : "";

    const a = document.createElement("a");
    a.className = "card";
    a.href = enlace;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `
      <div class="card-cab" style="background:${COLORES[i % COLORES.length]}">
        <span class="card-revista clamp1">${esc(p.revista)}</span>
        ${q ? `<span class="card-q">${q}</span>` : ""}
      </div>
      <div class="card-cuerpo">
        <h3 class="card-titulo clamp3">${esc(p.titulo)}</h3>
        ${p.miembros.length ? `<p class="card-autores clamp1">${esc(autoresTxt(p.miembros))}</p>` : ""}
        <span class="card-mas">${T.leer}</span>
      </div>`;
    return a;
  }

  // Rellena una fila con la lista duplicada (para que el bucle no se note)
  function pintarFila(fila, pubs, offsetColor) {
    fila.innerHTML = "";
    if (!pubs.length) { fila.style.display = "none"; return; }
    [...pubs, ...pubs].forEach((p, i) => {
      const card = crearCard(p, (i % pubs.length) * 2 + offsetColor);
      if (i >= pubs.length) {          // la copia no se lee ni se tabula dos veces
        card.setAttribute("aria-hidden", "true");
        card.tabIndex = -1;
      }
      fila.appendChild(card);
    });
    const anchoMitad = fila.scrollWidth / 2;
    fila.style.animationDuration = Math.max(40, anchoMitad / VELOCIDAD_PX_S) + "s";
  }

  function mostrarMensaje(msg) {
    document.getElementById("muro").innerHTML = `<p class="mensaje">${esc(msg)}</p>`;
  }

  function aplicarIdioma() {
    document.documentElement.lang = LANG;
    document.title = T.titulo;
    document.getElementById("bioma-titulo").textContent = T.titulo;
    document.getElementById("bioma-resumen").textContent = T.cargando;
    document.querySelector(".ver-todas").textContent = T.verTodas;
  }

  async function iniciar() {
    aplicarIdioma();
    try {
      const resp = await fetch(SHEET_CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const parsed = Papa.parse(await resp.text(), { header: true, skipEmptyLines: true });

      const filtradas = parsed.data.filter(row =>
        TIPOS_PERMITIDOS.has((row["Tipo de publicación"] || "").trim().toLowerCase())
      );

      const anioActual = String(new Date().getFullYear());
      const delAnio = agruparPublicaciones(filtradas).filter(p => p.anio === anioActual);

      document.getElementById("bioma-resumen").textContent =
        T.resumen(anioActual);

      if (!delAnio.length) { mostrarMensaje(T.sinDatos); return; }

      const elegidas = mezclar(delAnio).slice(0, MAX_PUBLICACIONES);
      // Con pocas publicaciones, una sola fila
      const f1 = elegidas.length < 8 ? elegidas : elegidas.filter((_, i) => i % 2 === 0);
      const f2 = elegidas.length < 8 ? [] : elegidas.filter((_, i) => i % 2 === 1);

      await document.fonts.ready;      // medir el ancho con las fuentes ya cargadas
      pintarFila(document.getElementById("fila1"), f1, 0);
      pintarFila(document.getElementById("fila2"), f2, 1);
    } catch (err) {
      console.error(err);
      document.getElementById("bioma-resumen").textContent = "";
      mostrarMensaje(T.error);
    }
  }

  iniciar();
</script>

</body>
</html>
